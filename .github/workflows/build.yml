name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            nasm xorriso mtools dosfstools \
            gcc-x86-64-linux-gnu musl-tools qemu-utils

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download Limine bootloader
        run: make limine/limine

      # Delegates to userspace/Makefile rather than restating what it builds.
      # This step used to carry its own hand-maintained copy of that Makefile's
      # ~40 `cp` lines, and the two drifted: `forktest` was added to the Makefile
      # and to programs.rs (unconditionally, unlike the cfg-gated lua/busybox/bash)
      # but never here, so amd64 failed with a bare
      #   include_bytes!: couldn't read .../userspace/bin/forktest.elf
      # while aarch64 stayed green -- its kernel cfg's `proc/` out entirely.
      # One source of truth means adding a userspace program can't break CI again.
      - name: Build userspace
        run: make -C userspace

      - name: Build kernel
        run: |
          cd kernel
          cargo +nightly build --release \
            --target x86_64-unknown-none \
            -Z build-std=core,alloc \
            -Z build-std-features=compiler-builtins-mem

      - name: Build ISO
        run: make

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide_os-x86_64.iso
          path: oxide_os-x86_64.iso
          retention-days: 7

  # Mirror of the port's own rule "x86-64 must stay green": nothing kept the
  # *ARM* build green either, so a broken aarch64 port could land unnoticed.
  #
  # Kernel-only, and deliberately so — `proc/` (which embeds the userspace
  # binaries via include_bytes!) and `installer/` are x86-gated, so the aarch64
  # kernel compiles with no userspace build and no cross toolchain at all.
  # Building an aarch64 ISO needs the userspace port, which is Track B step B8.
  build-aarch64:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none
          components: rust-src

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-

      - name: Build kernel (aarch64)
        run: |
          cd kernel
          RUSTFLAGS="-C relocation-model=static" \
            cargo +nightly build --release --target aarch64-unknown-none

  # DISABLED. Rolling releases are paused while the build is being stabilised — a
  # green `build` job is the gate for turning this back on, since this job would
  # otherwise keep publishing the `latest` tag from whatever last happened to pass.
  #
  # To re-enable: delete the `false &&` below. Nothing else here needs to change.
  release:
    needs: build
    runs-on: ubuntu-22.04
    if: false && github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: oxide_os-x86_64.iso

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from the latest commit on `master`.

            **Run in QEMU:**
            ```bash
            qemu-system-x86_64 -M pc -serial stdio -cdrom oxide_os-x86_64.iso \
              -boot d -m 2G -cpu max \
              -netdev user,id=net0 -device rtl8139,netdev=net0
            ```
          files: oxide_os-x86_64.iso
          prerelease: true
